<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Illustration of a refrigerator, washer and stove lined up for Dakota Valley appliance removal and recycling">
  <rect width="1200" height="800" fill="#f7faff"/>
  <rect y="600" width="1200" height="200" fill="#e4ebf3"/>
  <rect y="592" width="1200" height="10" fill="#d2dde8"/>
  <!-- fridge -->
  <g>
    <rect x="180" y="220" width="200" height="380" rx="14" fill="#ffffff" stroke="#cfdceb" stroke-width="6"/>
    <line x1="180" y1="360" x2="380" y2="360" stroke="#cfdceb" stroke-width="6"/>
    <rect x="350" y="270" width="14" height="60" rx="6" fill="#0957c3"/>
    <rect x="350" y="400" width="14" height="60" rx="6" fill="#0957c3"/>
  </g>
  <!-- washer -->
  <g>
    <rect x="440" y="300" width="220" height="300" rx="14" fill="#eef2f7" stroke="#cfdceb" stroke-width="6"/>
    <circle cx="550" cy="460" r="70" fill="#ffffff" stroke="#c2cedb" stroke-width="6"/>
    <circle cx="550" cy="460" r="40" fill="#dce6f1"/>
    <rect x="460" y="320" width="180" height="24" rx="8" fill="#cdd8e4"/>
  </g>
  <!-- stove -->
  <g>
    <rect x="720" y="320" width="220" height="280" rx="14" fill="#ffffff" stroke="#cfdceb" stroke-width="6"/>
    <rect x="740" y="360" width="180" height="60" rx="8" fill="#0b3d8c"/>
    <circle cx="780" cy="470" r="20" fill="#cdd8e4"/><circle cx="840" cy="470" r="20" fill="#cdd8e4"/><circle cx="900" cy="470" r="20" fill="#cdd8e4"/>
  </g>
  <!-- microwave -->
  <g>
    <rect x="1000" y="430" width="150" height="120" rx="10" fill="#eef2f7" stroke="#cfdceb" stroke-width="6"/>
    <rect x="1018" y="450" width="80" height="80" rx="6" fill="#0957c3"/>
  </g>
  <!-- recycle badge -->
  <g transform="translate(1040 250)">
    <circle r="60" fill="#0957c3"/>
    <path d="M-22 -6 L0 -34 L22 -6 M0 -34 L0 14" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0)"/>
  </g>
</svg>
