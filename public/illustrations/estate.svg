<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Illustration of a full property cleanout with furniture, boxes and appliances ready for Dakota Valley estate removal">
  <rect width="1200" height="800" fill="#f7faff"/>
  <rect y="610" width="1200" height="190" fill="#e4ebf3"/>
  <rect y="602" width="1200" height="10" fill="#d2dde8"/>
  <!-- dresser -->
  <g>
    <rect x="120" y="380" width="200" height="220" rx="8" fill="#d8b48a"/>
    <rect x="140" y="400" width="160" height="40" fill="#c79c6e"/>
    <rect x="140" y="460" width="160" height="40" fill="#c79c6e"/>
    <rect x="140" y="520" width="160" height="40" fill="#c79c6e"/>
  </g>
  <!-- sofa -->
  <g>
    <rect x="360" y="470" width="260" height="130" rx="16" fill="#0957c3"/>
    <rect x="360" y="430" width="260" height="70" rx="16" fill="#0b64e0"/>
    <rect x="350" y="450" width="36" height="150" rx="12" fill="#07306e"/>
    <rect x="594" y="450" width="36" height="150" rx="12" fill="#07306e"/>
  </g>
  <!-- boxes -->
  <g>
    <rect x="660" y="470" width="130" height="130" fill="#e0c39e"/><rect x="660" y="470" width="130" height="18" fill="#c79c6e"/>
    <rect x="680" y="370" width="100" height="100" fill="#d8b48a"/><rect x="680" y="370" width="100" height="16" fill="#c79c6e"/>
  </g>
  <!-- fridge -->
  <rect x="830" y="360" width="150" height="240" rx="12" fill="#ffffff" stroke="#cfdceb" stroke-width="6"/>
  <line x1="830" y1="450" x2="980" y2="450" stroke="#cfdceb" stroke-width="6"/>
  <!-- lamp -->
  <g stroke="#9fb3c8" stroke-width="10" fill="none"><path d="M1050 600 L1050 430"/></g>
  <polygon points="1010,430 1090,430 1075,370 1025,370" fill="#cdd8e4"/>
  <!-- chair stacked -->
  <g>
    <rect x="1000" y="500" width="90" height="60" rx="8" fill="#b8c7d8"/>
    <rect x="1000" y="450" width="90" height="60" rx="8" fill="#9fb3c8"/>
  </g>
</svg>
