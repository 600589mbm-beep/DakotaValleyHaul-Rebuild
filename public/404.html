<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dakota Valley Junk Removal</title>
    <!-- GitHub Pages SPA fallback: redirect deep URLs back to / with the
         original path encoded in the query string. index.html decodes it
         and hands off to react-router. See https://github.com/rafgraph/spa-github-pages -->
    <script>
      (function () {
        var pathSegmentsToKeep = 0; // 0 for apex / custom domain at root
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
