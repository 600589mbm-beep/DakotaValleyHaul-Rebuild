name: Validate service copy update
on:
  push:
    branches: [fix/service-promises-review-policy]
permissions:
  contents: write
concurrency:
  group: service-copy-update
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Apply source corrections
        run: |
          node scripts/apply-service-copy-update.mjs
          node scripts/finish-service-copy.mjs
      - name: Build and validate
        run: |
          npm run build > /tmp/site-build.log 2>&1 || { tail -70 /tmp/site-build.log; exit 1; }
          tail -8 /tmp/site-build.log
          node scripts/validate-service-promises.mjs
          git diff --check
      - name: Report changed source and remaining access references
        run: |
          git diff --stat
          python3 - <<'PY'
          from pathlib import Path
          import re
          pattern=re.compile(r'inside removal|indoor carry.out|Crew handles stairs|crew brings everything|calendar link|no load minimum|\$25 off with review')
          for p in Path('src').rglob('*'):
              if p.suffix not in ['.js','.astro'] or p.name=='servicePolicy.js': continue
              for i,line in enumerate(p.read_text().splitlines(),1):
                  if pattern.search(line): print(f'REVIEW {p}:{i}: {line.strip()}')
          PY
      - name: Commit validated source corrections
        run: |
          git config user.name 'Dakota Valley site maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts public/llms.txt public/llm-sitemap.json docs/LLM-Sitemap.md package.json
          git diff --cached --quiet || git commit -m 'Align public service scope, pricing, and pickup promises; remove review incentive'
          git push origin HEAD:fix/service-promises-review-policy
