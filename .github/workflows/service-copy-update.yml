name: Validate service copy update
on:
  push:
    branches: [fix/service-promises-review-policy]
permissions:
  contents: write
concurrency:
  group: service-copy-update
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Polish approved source copy
        run: |
          node scripts/polish-service-copy.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/data/comboContent.js')
          s=p.read_text().replace('selective room cleanouts','pre-selected staged items')
          p.write_text(s)
          PY
      - name: Build and validate all pages
        run: |
          npm run build > /tmp/site-build.log 2>&1 || { tail -65 /tmp/site-build.log; exit 1; }
          tail -8 /tmp/site-build.log
          git diff --check
      - name: Commit validated source corrections
        run: |
          git config user.name 'Dakota Valley site maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts package.json
          git diff --cached --stat
          git diff --cached --quiet || git commit -m 'Preserve service-specific content while aligning pickup and quote promises'
          git push origin HEAD:fix/service-promises-review-policy
