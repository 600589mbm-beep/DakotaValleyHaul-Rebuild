name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build
        # prebuild (reviews refresh + image-sitemap + og-card) runs automatically.
        # Review keys are optional — fetch-reviews skips cleanly when unset.
        run: npm run build
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # Classic Google/Bing sitemap "ping" endpoints were retired in 2023, so we
      # notify via IndexNow (Bing, Yandex, etc.). IndexNow does not parse
      # sitemaps — it needs the URL list POSTed. The key is public by design
      # (it must be hosted at the site root), so it lives in the repo at
      # public/<key>.txt and is hardcoded here.
      - name: Notify search engines (IndexNow)
        run: |
          KEY=a8a8788968d87d8f1b70cc9159e82357
          HOST=dakotavalleyjunkremovalservice.com
          sleep 30  # let Pages finish propagating so the key file resolves
          curl -fsS "https://${HOST}/sitemap-0.xml" \
            | grep -o '<loc>[^<]*</loc>' \
            | sed -e 's/<\/\?loc>//g' \
            | jq -R -s --arg host "$HOST" --arg key "$KEY" \
                '{host: $host, key: $key, keyLocation: ("https://" + $host + "/" + $key + ".txt"), urlList: (split("\n") | map(select(length > 0)))}' \
            | curl -fsS -X POST "https://api.indexnow.org/indexnow" \
                -H "Content-Type: application/json; charset=utf-8" \
                --data @- || echo "IndexNow submission failed (non-fatal)"
