name: Deploy Telegram Worker

on:
  push:
    branches: [main]
    paths:
      - telegram-worker.js
      - worker/**
      - src/lib/lead-attribution.js
      - scripts/configure-lead-tracking.mjs
      - wrangler.toml
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WORKERS_DEV_SUBDOMAIN: dakota-valley-haul-600589
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm ci
      - name: Test Worker and attribution
        run: node --test src/lib/lead-attribution.test.js worker/lead-tracking.test.js
      - name: Prepare private lead reporting
        run: node scripts/configure-lead-tracking.mjs prepare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      - name: Ensure workers.dev subdomain
        shell: bash
        run: |
          response="$(curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/subdomain" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data "{\"subdomain\":\"${WORKERS_DEV_SUBDOMAIN}\"}")"
          if [ "$(printf '%s' "$response" | jq -r '.success')" != "true" ]; then
            code="$(printf '%s' "$response" | jq -r '.errors[0].code // empty')"
            if [ "$code" = "10036" ]; then
              echo "workers.dev subdomain already exists (10036) — continuing."
            else
              printf '%s\n' "$response" | jq -c '.errors'
              exit 1
            fi
          fi
      - name: Deploy Worker with secrets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.generated.toml
          secrets: |
            TELEGRAM_BOT_TOKEN
            TELEGRAM_CHAT_ID
            TELEGRAM_WEBHOOK_SECRET
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Enable private Telegram job status controls
        run: node scripts/configure-lead-tracking.mjs register
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
